<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body>

    <!-- Decorative Top Shapes -->
    <div class="top-shapes">
        ✨ ✨
    </div>

    <!-- Left Image -->
    <img src="https://pngimg.com/d/bottle_PNG2099.png" class="left-image">

    <!-- Right Image -->
    <img src="https://pngimg.com/d/food_PNG57.png" class="right-image">

    <!-- Green Curve -->
    <div class="bottom-curve"></div>

    <!-- LOGIN BOX -->
    <div class="login-container">

        <h1>Login</h1>

        <!-- Username -->
        <div class="input-box">
            <input type="text" placeholder="Username">
            <i class="fa-solid fa-user"></i>
        </div>

        <!-- Password -->
        <div class="input-box">
            <input type="password" placeholder="Password">
            <i class="fa-solid fa-lock"></i>
        </div>

        <!-- Options -->
        <div class="options">
            
            <p class="signup-link" id="openSignup">Sign Up</p>
        </div>

        <!-- Button -->
        <button id="loginBtn">Login</button>

    </div>

    <!-- SIGNUP POPUP -->

    <!-- SIGNUP POPUP -->

<div class="popup" id="signupPopup">

    <div class="popup-box">

        <span class="close-btn" id="closePopup">&times;</span>

        <h2>Sign Up</h2>

        <!-- Username -->
        <div class="input-box">
            <input type="text" placeholder="Username">
            <i class="fa-solid fa-user"></i>
        </div>

        <!-- Phone Number -->
        <div class="input-box">
            <input type="tel" placeholder="Phone Number">
            <i class="fa-solid fa-phone"></i>
        </div>

        <!-- Password -->
        <div class="input-box">
            <input type="password" placeholder="Password">
            <i class="fa-solid fa-lock"></i>
        </div>

        <!-- OTP -->
        <div class="input-box">
            <input type="text" placeholder="Enter OTP">
            <i class="fa-solid fa-key"></i>
        </div>

        <!-- Send OTP -->
        <button class="otp-btn" id="otpBtn">
            Send OTP
        </button>

        <!-- Signup Button -->
        <button class="signup-btn">
            Create Account
        </button>

    </div>

</div>

    <!-- JS -->
    <script src="script.js"></script>

</body>
</html>
